<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | YourType</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="../images/logo.png">
</head>
<body>
    <div id="container">
        <h1 id="title">YourType</h1>
        <p id="subtitle">Make a font out of your handwriting!</p>
        <button id="godraw">start writing</button>
    </div>
    <script>
        const godraw = document.getElementById("godraw");
        godraw.addEventListener("pointerenter", ()=>{
            godraw.style.filter = "brightness(85%)";
        });
        godraw.addEventListener("pointerleave", ()=>{
            godraw.style.filter = "brightness(100%)";
        });
        godraw.addEventListener("pointerdown", ()=>{
            godraw.style.filter = "brightness(80%)";
        });
        godraw.addEventListener("pointerup", ()=>{
            godraw.style.filter = "brightness(100%)";
        });
        godraw.addEventListener("click", ()=>{
            window.location = "/draw";
        });
    </script>
</body>
