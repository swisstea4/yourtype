<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas</title>
    <script src="prereq.js" defer></script>
    <script src="draw.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="wrapper">
        <div id="text">
            <p id="writetheletter">Write the letter</p>
            <p id="letter">A</p>
        </div>
        <div id="drawTools">
            <div id="buttons">
                <button id="guidelines" type="button">
                    <img src="images/guidelines.png">
                </button>
                <button id="undo" type="button">
                    <img src="images/undo.png">
                </button>
                <button id="settings" type="button">
                    <img src="images/settings.png">
                </button>
                <div id="resize">
                    <button id="resizebtn">
                        <img src="images/resize.png">
                    </button>
                    <button id="decrease" type="button"></button>
                    <button id="increase" type="button"></button>
                </div>
            </div>
            <div id="canvasRow">
                <button id="previous" type="button">
                    <img src="images/previous.png">
                </button>
                <div id="canvasStyling">
                    <canvas id="canvasA"></canvas>
                    <img src="images/canvasbg.png" id="canvasBG">
                </div>
                <button id="next" type="button">
                    <img src="images/next.png">
                </button>
            </div>
        </div>
    </div>
</body>
</html>
