<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas</title>
    <script src="prereq.js" defer></script>
    <script src="draw.js" defer></script>
    <script src="button.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="centersettings">
        <div id="settingspage">
            <img src="images/settingsbg.png" id="settingsbg">
            <button id="black" class="colors"></button>
            <button id="red" class="colors"></button>
            <button id="green" class="colors"></button>
            <button id="yellow" class="colors"></button>
            <button id="white" class="colors"></button>
            <button id="blue" class="colors"></button>
            <button id="pink" class="colors"></button>
            <button id="brown" class="colors"></button>
        </div>
    </div>
    <div id="wrapper">
        <div id="text">
            <p id="writetheletter">Write the letter</p>
            <p id="letter">A</p>
        </div>
        <div id="drawTools">
            <div id="buttons">
                <button id="guidelines" type="button">
                    <img src="images/guidelines.png"id="guidelinesimg">
                </button>
                <button id="undo" type="button">
                    <img src="images/undo.png" id="undoimg">
                </button>
                <button id="settings" type="button">
                    <img src="images/settings.png" id="settingsimg">
                </button>
                <div id="resize">
                    <button id="resizebtn">
                        <img src="images/resize.png" id="resizeimg">
                    </button>
                    <button id="decrease" type="button"></button>
                    <button id="increase" type="button"></button>
                </div>
            </div>
            <div id="canvasRow">
                <button id="previous" type="button">
                    <img src="images/previous.png" id="previousimg">
                </button>
                <div id="canvasStyling">
                    <canvas id="canvasA"></canvas>
                    <img src="images/canvasbg0.png" id="canvasBG">
                </div>
                <button id="next" type="button">
                    <img src="images/next.png" id="nextimg">
                </button>
            </div>
        </div>
    </div>
</body>
</html>
