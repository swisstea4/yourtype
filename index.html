<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas</title>
    <script src="prereq.js" defer></script>
    <script src="draw.js" defer></script>
    <script src="button.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="centersettings">
        <div id="settingspage">
            <img src="images/settingsbg.png" id="settingsbg" draggable="false">
            <canvas id="settingscanvas"></canvas>
            <button id="black" class="colors"></button>
            <button id="red" class="colors"></button>
            <button id="green" class="colors"></button>
            <button id="yellow" class="colors"></button>
            <button id="white" class="colors"></button>
            <button id="blue" class="colors"></button>
            <button id="pink" class="colors"></button>
            <button id="brown" class="colors"></button>

            <button id="size1"></button>
            <button id="size2"></button>
            <button id="size3"></button>
            <button id="size4"></button>
        </div>
    </div>
    <div id="wrapper">
        <div id="text">
            <p id="writetheletter">Write the letter</p>
            <p id="letter">A</p>
        </div>
        <div id="drawTools">
            <div id="buttons">
                <button id="guidelines" type="button">
                    <img src="images/guidelines.png"id="guidelinesimg" draggable="false">
                </button>
                <button id="undo" type="button">
                    <img src="images/undo.png" id="undoimg" draggable="false">
                </button>
                <button id="settings" type="button">
                    <img src="images/settings.png" id="settingsimg" draggable="false">
                </button>
                <div id="resize">
                    <button id="resizebtn">
                        <img src="images/resize.png" id="resizeimg" draggable="false">
                    </button>
                    <button type="button" id="decrease"></button>
                    <button type="button" id="increase"></button>
                    <img src="images/decrease.png" id="decreaseimg" draggable="false">
                    <img src="images/increase.png" id="increaseimg" draggable="false">
                </div>
            </div>
            <div id="canvasRow">
                <button id="previous" type="button">
                    <img src="images/previous.png" id="previousimg" draggable="false">
                </button>
                <div id="canvasStyling">
                    <canvas id="canvas"></canvas>
                    <img src="images/canvasbg0.png" id="canvasBG" draggable="false">
                    <img src="images/canvasbgtl.png" id="canvasbgtl" draggable="false">
                    <img src="images/canvasbgtr.png" id="canvasbgtr" draggable="false">
                    <div id="nextcoverup"></div>
                </div>
                <button id="next" type="button">
                    <img src="images/next.png" id="nextimg" draggable="false">
                </button>
            </div>
        </div>
    </div>
</body>
</html>
